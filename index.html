<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf2df">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sourdough">
  <meta name="description" content="A simple offline sourdough feeding ratio calculator.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="./styles.css">
  <title>Sourdough Feeding Calculator</title>
</head>
<body>
  <main class="app-shell">
    <section class="header" aria-labelledby="app-title">
      <div class="bread" aria-hidden="true">🍞</div>
      <h1 id="app-title">Sourdough Feeding<br>Calculator</h1>
    </section>

    <section class="field-group">
      <label for="ratio">Feeding Ratio</label>
      <div class="select-wrap">
        <select id="ratio" aria-label="Feeding ratio">
          <option value="1:1:1" data-water="1" data-flour="1">1:1:1</option>
          <option value="1:2:2" data-water="2" data-flour="2">1:2:2</option>
          <option value="1:2:3" data-water="2" data-flour="3" selected>1:2:3</option>
          <option value="1:3:3" data-water="3" data-flour="3">1:3:3</option>
          <option value="1:4:4" data-water="4" data-flour="4">1:4:4</option>
          <option value="1:5:5" data-water="5" data-flour="5">1:5:5</option>
          <option value="1:10:10" data-water="10" data-flour="10">1:10:10</option>
        </select>
      </div>
    </section>

    <section class="field-group">
      <label for="starter">How much starter do you have?</label>
      <div class="starter-card">
        <input
          id="starter"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="0"
          aria-label="Starter amount in grams"
        >
        <span class="grams">g</span>
      </div>
      <button id="done" class="done-button" type="button" hidden>Done</button>
    </section>

    <section class="results" aria-live="polite" aria-label="Calculated feeding amounts">
      <article class="result-card">
        <span class="result-icon" aria-hidden="true">💧</span>
        <span class="result-title">Water</span>
        <strong id="water">0 g</strong>
      </article>

      <article class="result-card">
        <span class="result-icon" aria-hidden="true">🌾</span>
        <span class="result-title">Flour</span>
        <strong id="flour">0 g</strong>
      </article>
    </section>

    <section class="total-card" aria-live="polite">
      <span>TOTAL STARTER</span>
      <strong id="total">0 g</strong>
    </section>

    <button id="clear" class="clear-button" type="button" hidden>Clear</button>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
